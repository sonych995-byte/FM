<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181b;
    --surface:#1d2125;
    --surface-hi:#262b30;
    --line:#2b3136;
    --text:#ecebe6;
    --dim:#868d94;
    --teal:#4fd1b5;
    --teal-dim:#2a4a44;
    --amber:#e8a33d;
    --amber-dim:#4a3a20;
    --radius:6px;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  ::selection{background:var(--teal-dim);}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    flex-shrink:0;
  }
  .logo{
    font-family:var(--mono);
    font-weight:700;
    font-size:15px;
    color:var(--teal);
    letter-spacing:0.5px;
  }
  .crumbs{
    flex:1;
    display:flex;
    align-items:center;
    gap:4px;
    font-family:var(--mono);
    font-size:13px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .crumbs::-webkit-scrollbar{display:none;}
  .crumb{
    color:var(--dim);
    background:transparent;
    border:none;
    padding:4px 7px;
    border-radius:4px;
    cursor:pointer;
    font:inherit;
  }
  .crumb:hover, .crumb:focus-visible{background:var(--surface-hi); color:var(--text); outline:2px solid var(--teal); outline-offset:-2px;}
  .crumb.current{color:var(--text); font-weight:500;}
  .crumb-sep{color:var(--line); font-size:12px;}

  .btn{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    background:var(--surface-hi);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:7px 12px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .12s ease, transform .08s ease;
  }
  .btn:hover{background:#2d3338;}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .btn.subtle{background:transparent; border-color:transparent; color:var(--dim);}
  .btn.subtle:hover{color:var(--text); background:var(--surface-hi);}
  .btn.accent{background:var(--teal); color:#0e1512; border-color:var(--teal);}
  .btn.accent:hover{background:#63e0c4;}
  .btn.danger{background:var(--amber); color:#241a06; border-color:var(--amber);}
  .btn.danger:hover{background:#f0b357;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}

  /* ---------- grid (icon style) ---------- */
  .main{
    flex:1;
    overflow-y:auto;
    padding:20px;
  }
  .empty-state{
    color:var(--dim);
    font-family:var(--mono);
    font-size:13px;
    padding:60px 0;
    text-align:center;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
    gap:6px;
    min-height:100%;
  }
  .entry{
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:12px 6px 10px;
    cursor:pointer;
    user-select:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transition:background .1s ease, border-color .1s ease;
  }
  .entry:hover{background:var(--surface);}
  .entry:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  .entry.active{background:var(--teal-dim); border-color:var(--teal);}
  .entry .icon{width:34px; height:34px; flex-shrink:0;}
  .entry .icon.dir{color:var(--teal);}
  .entry .icon.file{color:var(--dim);}
  .entry:hover .icon.file{color:var(--text);}
  .entry .name{
    font-size:12.5px;
    text-align:center;
    line-height:1.3;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    max-width:100%;
  }

  /* ---------- context menu ---------- */
  .ctx-menu{
    position:fixed;
    min-width:150px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    z-index:60;
    display:none;
    flex-direction:column;
    gap:1px;
  }
  .ctx-menu.open{display:flex;}
  .ctx-item{
    background:none;
    border:none;
    color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    text-align:left;
    padding:8px 10px;
    border-radius:5px;
    cursor:pointer;
    display:block;
    width:100%;
  }
  .ctx-item:hover, .ctx-item:focus-visible{background:var(--surface-hi); outline:none;}
  .ctx-item.danger{color:var(--amber);}
  .ctx-item.danger:hover{background:var(--amber-dim);}

  /* ---------- composer strip (signature element) ---------- */
  .composer{
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--surface);
    padding:10px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:54px;
  }
  .command-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .command-input{
    flex:1;
    min-width:0;
  }
  .receipt{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:13px;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }
  .receipt::-webkit-scrollbar{display:none;}
  .receipt .placeholder{color:var(--dim);}
  .chip{
    background:var(--surface-hi);
    border:1px solid var(--line);
    border-radius:4px;
    padding:4px 8px;
    color:var(--text);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .chip.verb{color:var(--teal); border-color:var(--teal-dim); background:var(--teal-dim);}
  .chip .x{
    color:var(--dim);
    cursor:pointer;
    font-size:11px;
  }
  .chip .x:hover{color:var(--amber);}
  .receipt-arrow{color:var(--line);}
  .quick-input{
    background:var(--bg);
    border:1px solid var(--teal);
    border-radius:4px;
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
    padding:4px 8px;
    outline:none;
    min-width:120px;
  }

  /* ---------- log drawer ---------- */
  .log{
    position:fixed;
    right:0; bottom:0; top:0;
    width:340px;
    max-width:88vw;
    background:var(--surface);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .18s ease;
    display:flex;
    flex-direction:column;
    z-index:30;
  }
  .log.open{transform:translateX(0);}
  .log-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .log-body{
    flex:1;
    overflow-y:auto;
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .log-empty{color:var(--dim); font-family:var(--mono); font-size:12px; padding:20px 4px;}
  .log-entry{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 10px;
    font-family:var(--mono);
    font-size:11.5px;
  }
  .log-entry .cmd{color:var(--text); word-break:break-all;}
  .log-entry .status{
    display:inline-block;
    margin-top:5px;
    font-size:10px;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:3px;
  }
  .log-entry .status.ok{color:#9be6ce; background:var(--teal-dim);}
  .log-entry .status.fail{color:#f6cf94; background:var(--amber-dim);}
  .log-entry .out{
    margin-top:6px;
    color:var(--dim);
    white-space:pre-wrap;
    max-height:120px;
    overflow-y:auto;
  }
  .drawer-scrim{
    position:fixed; inset:0;
    background:rgba(0,0,0,.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:25;
  }
  .drawer-scrim.show{opacity:1; pointer-events:auto;}

  /* ---------- modal (confirm / error / info) ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,12,13,.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
    z-index:80;
    padding:20px;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    width:100%;
    max-width:420px;
    padding:20px 20px 16px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:translateY(6px) scale(.98);
    transition:transform .15s ease;
  }
  .modal-overlay.open .modal-card{transform:translateY(0) scale(1);}
  .modal-title{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--dim);
    margin:0 0 10px;
  }
  .modal-title.err{color:var(--amber);}
  .modal-message{
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.55;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
    max-height:40vh;
    overflow-y:auto;
    margin-bottom:18px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  @media (max-width:560px){
    .crumbs{font-size:12px;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(78px,1fr));}
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="logo">ƒm</span>
    <div class="crumbs" id="crumbs"></div>
    <button class="btn subtle" id="btnOscmd" title="Run a raw OS command">⌘</button>
    <button class="btn subtle" id="btnLog">log</button>
  </div>

  <div class="main" id="main">
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">nothing here — right-click to create something</div>
  </div>

  <div class="composer">
    <div class="command-row">
      <input id="rawCommandInput" class="quick-input command-input" type="text" spellcheck="false" autocomplete="off" placeholder="type an FM command, e.g. help or ls .">
    </div>
    <div class="receipt" id="receipt">
      <span class="placeholder">right-click a file or folder to act on it</span>
    </div>
    <div class="command-row">
      <button class="btn subtle" id="btnClear" style="display:none;">clear</button>
      <button class="btn accent" id="btnRun" disabled>Run ▸</button>
    </div>
  </div>

  <!-- context menu (shared for entries + empty area) -->
  <div class="ctx-menu" id="ctxMenu"></div>

  <!-- log drawer -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <div class="log" id="log">
    <div class="log-head">
      <span>Activity</span>
      <button class="btn subtle" id="btnLogClose">✕</button>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty">Commands you run will appear here.</div>
    </div>
  </div>

  <!-- modal: confirm / error / info -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <p class="modal-title" id="modalTitle">Confirm</p>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

<script>
/* =====================================================================
   API CONTRACT — adjust these two calls to match your Flask bridge.
   listDir(path)  -> GET  /api/list?path=<path>
                      => { path: string, entries: [{name, type: "dir"|"file"}] }
   runCommand(cmd)-> POST /api/run   body: { command: string }
                      => { ok: boolean, output: string, path?: string }
   ===================================================================== */
const API = {
  async listDir(path){
    const res = await fetch(`/api/list?path=${encodeURIComponent(path ?? '')}`);
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.output || 'list failed');
    return data;
  },
  async runCommand(command){
    const res = await fetch('/api/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ command })
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.output || 'run failed');
    return data;
  }
};

/* ---------------------------- icons ---------------------------- */
const ICON_DIR = `<svg class="icon dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2h9a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>`;
const ICON_FILE = `<svg class="icon file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-18a1 1 0 0 1 1-1z"/><path d="M14 2.5v4h4"/><path d="M8 13h8M8 16.5h8"/></svg>`;

/* ---------------------------- state ---------------------------- */
let state = {
  path: '.',
  entries: [],
  pending: null,   // {verb, tokens:[{label,value,input,removable,placeholder}]}
};

const el = {
  crumbs: document.getElementById('crumbs'),
  grid: document.getElementById('grid'),
  empty: document.getElementById('emptyState'),
  receipt: document.getElementById('receipt'),
  rawCommandInput: document.getElementById('rawCommandInput'),
  btnRun: document.getElementById('btnRun'),
  btnClear: document.getElementById('btnClear'),
  log: document.getElementById('log'),
  logBody: document.getElementById('logBody'),
  drawerScrim: document.getElementById('drawerScrim'),
  ctxMenu: document.getElementById('ctxMenu'),
  modalOverlay: document.getElementById('modalOverlay'),
  modalTitle: document.getElementById('modalTitle'),
  modalMessage: document.getElementById('modalMessage'),
  modalActions: document.getElementById('modalActions'),
};

/* ---------------------------- rendering: crumbs + grid ---------------------------- */
function renderCrumbs(){
  const parts = state.path.split(/[\\/]/).filter(Boolean);
  // ใหม่ — รองรับทั้ง /unix/path และ C:\windows\path
  const isAbs = /^[/\\]/.test(state.path) || /^[A-Za-z]:[\\/]/.test(state.path);
  el.crumbs.innerHTML = '';
  const addCrumb = (label, target, isLast) => {
    const b = document.createElement('button');
    b.className = 'crumb' + (isLast ? ' current' : '');
    b.textContent = label;
    b.addEventListener('click', () => { if(!isLast) navigateTo(target); });
    el.crumbs.appendChild(b);
    if(!isLast){
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      el.crumbs.appendChild(sep);
    }
  };
  addCrumb(isAbs ? '/' : '.', isAbs ? '/' : '.', parts.length === 0);
  let acc = isAbs ? '' : '.';
  parts.forEach((p, i) => {
    acc += '/' + p;
    addCrumb(p, acc, i === parts.length - 1);
  });
}

function renderGrid(){
  el.grid.innerHTML = '';
  el.empty.style.display = state.entries.length ? 'none' : 'block';
  state.entries.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'entry';
    card.tabIndex = 0;
    card.innerHTML = `${entry.type === 'dir' ? ICON_DIR : ICON_FILE}<span class="name">${escapeHtml(entry.name)}</span>`;
    card.addEventListener('dblclick', () => openEntry(entry));
    card.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openEntryContextMenu(e, entry);
    });
    card.addEventListener('keydown', (e) => { if(e.key === 'Enter') openEntry(entry); });
    el.grid.appendChild(card);
  });
}

function openEntry(entry){
  if(entry.type === 'dir'){
    navigateTo(joinPath(state.path, entry.name));
  } else {
    runAndShow(`cat ${quoteIfNeeded(entryPath(entry.name))}`, entry.name);
  }
}

/* ---------------------------- context menu ---------------------------- */
function openEntryContextMenu(e, entry){
  const items = entry.type === 'file'
    ? [
        { label:'Edit',   action:() => beginEdit(entry.name) },
        { label:'Rename', action:() => beginRename(entry.name) },
        { label:'Info',   action:() => runAndShow(`info ${quoteIfNeeded(entryPath(entry.name))}`, entry.name) },
        { label:'Delete', danger:true, action:() => requestDelete(entry.name) },
      ]
    : [
        { label:'Open (cd)', action:() => navigateTo(joinPath(state.path, entry.name)) },
        { label:'Rename',    action:() => beginRename(entry.name) },
        { label:'Info',      action:() => runAndShow(`info ${quoteIfNeeded(entryPath(entry.name))}`, entry.name) },
        { label:'Delete',    danger:true, action:() => requestDelete(entry.name) },
      ];
  showContextMenu(e.clientX, e.clientY, items);
}

function openEmptyContextMenu(e){
  const items = [
    { label:'New folder', action:() => beginMk('dir') },
    { label:'New file',   action:() => beginMk('file') },
  ];
  showContextMenu(e.clientX, e.clientY, items);
}

function showContextMenu(x, y, items){
  el.ctxMenu.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'ctx-item' + (it.danger ? ' danger' : '');
    b.textContent = it.label;
    b.addEventListener('click', () => { closeContextMenu(); it.action(); });
    el.ctxMenu.appendChild(b);
  });
  el.ctxMenu.classList.add('open');
  // position, then clamp inside viewport
  el.ctxMenu.style.left = '0px';
  el.ctxMenu.style.top = '0px';
  const rect = el.ctxMenu.getBoundingClientRect();
  const clampedX = Math.min(x, window.innerWidth - rect.width - 8);
  const clampedY = Math.min(y, window.innerHeight - rect.height - 8);
  el.ctxMenu.style.left = Math.max(8, clampedX) + 'px';
  el.ctxMenu.style.top = Math.max(8, clampedY) + 'px';
}

function closeContextMenu(){
  el.ctxMenu.classList.remove('open');
}

document.getElementById('main').addEventListener('contextmenu', (e) => {
  if(e.target.closest('.entry')) return; // handled by entry's own listener
  e.preventDefault();
  openEmptyContextMenu(e);
});
document.addEventListener('click', (e) => {
  if(!el.ctxMenu.contains(e.target)) closeContextMenu();
});
document.addEventListener('scroll', closeContextMenu, true);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeContextMenu(); });

/* ---------------------------- composer / receipt ---------------------------- */
function renderReceipt(){
  el.receipt.innerHTML = '';
  el.btnClear.style.display = state.pending ? 'inline-flex' : 'none';
  if(!state.pending){
    el.receipt.innerHTML = `<span class="placeholder">right-click a file or folder to act on it</span>`;
    el.btnRun.disabled = true;
    return;
  }
  const verbChip = document.createElement('span');
  verbChip.className = 'chip verb';
  verbChip.textContent = state.pending.verb;
  el.receipt.appendChild(verbChip);

  state.pending.tokens.forEach((t) => {
    const arrow = document.createElement('span');
    arrow.className = 'receipt-arrow';
    arrow.textContent = '›';
    el.receipt.appendChild(arrow);

    if(t.input){
      const input = document.createElement('input');
      input.className = 'quick-input';
      input.placeholder = t.placeholder || '';
      input.value = t.value || '';
      input.addEventListener('input', () => { t.value = input.value; syncRunEnabled(); });
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptRun(); });
      el.receipt.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = t.label;
      if(t.removable){
        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '✕';
        x.addEventListener('click', () => { state.pending = null; renderReceipt(); });
        chip.appendChild(x);
      }
      el.receipt.appendChild(chip);
    }
  });
  syncRunEnabled();
}

function syncRunEnabled(){
  const typed = (el.rawCommandInput.value || '').trim();
  if(!state.pending){ el.btnRun.disabled = !typed; return; }
  const missing = state.pending.tokens.some(t => t.input && !t.value?.trim());
  el.btnRun.disabled = !typed && missing;
}

function startVerb(verb, tokens){
  state.pending = { verb, tokens };
  renderReceipt();
}

el.btnClear.addEventListener('click', () => { state.pending = null; renderReceipt(); });

/* ---- flows that need typed input (kept in the composer, per requirements) ---- */
function beginRename(name){
  startVerb('rn', [
    { label:name, value:name, removable:true },
    { input:true, placeholder:'new name', value:'' }
  ]);
}
function beginEdit(name){
  startVerb('edit', [
    { input:true, placeholder:'editor (e.g. code)', value:'' },
    { label:name, value:name, removable:true }
  ]);
}
function beginMk(kind){
  startVerb('mk', [
    { label:kind, value:kind },
    { input:true, placeholder: kind === 'dir' ? 'folder name' : 'file name', value:'' }
  ]);
}
document.getElementById('btnOscmd').addEventListener('click', () => {
  startVerb('oscmd', [
    { input:true, placeholder:'raw OS command…', value:'' }
  ]);
});

/* ---- flows that need only a click (confirm modal or immediate run) ---- */
function requestDelete(name){
  openModal({
    kind:'confirm',
    title:'Delete',
    message:`Delete "${name}"?\nThis can't be undone.`,
    onConfirm: () => executeCommand(`rm ${quoteIfNeeded(entryPath(name))} Y`)
  });
}

function runAndShow(command, label){
  executeCommand(command, { showResult:true, resultTitle:label });
}

/* ---------------------------- run + log ---------------------------- */
function buildCommandString(){
  const p = state.pending;
  const values = p.tokens.map(t => t.value);
  if(p.verb === 'rn' && values[1]) values[1] = entryPath(values[1]);
  if(p.verb === 'mk' && values[1]) values[1] = entryPath(values[1]);
  if(p.verb === 'edit' && values[1]) values[1] = entryPath(values[1]);
  const parts = [p.verb, ...values.map(t => quoteIfNeeded(t))];
  return parts.join(' ');
}

function attemptRun(){
  const typed = (el.rawCommandInput.value || '').trim();
  if(typed){
    executeCommand(typed, { showResult:true, resultTitle:'Command result', clearInput:true });
    return;
  }
  if(!state.pending || el.btnRun.disabled) return;
  const command = buildCommandString();
  if(state.pending.verb === 'oscmd'){
    openModal({
      kind:'confirm',
      title:'Run OS command',
      message:command,
      onConfirm: () => executeCommand(command)
    });
    return;
  }
  executeCommand(command);
}
el.btnRun.addEventListener('click', attemptRun);
el.rawCommandInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); attemptRun(); }});

async function executeCommand(command, opts = {}){
  el.btnRun.disabled = true;
  try{
    const result = await API.runCommand(command);
    const responseText = result.response || result.output || '';

    // Update GUI path after cd command
    if(responseText.startsWith("PATH:")){
      state.path = responseText.substring(5);
    }

    const ok = result.ok !== false;
    logEntry(command, ok, responseText);

    if(!ok){
      openModal({ kind:'error', title:'Command failed', message: responseText || 'The command did not complete successfully.' });
    } else if(opts.showResult){
      openModal({ kind:'info', title: opts.resultTitle || 'Result', message: responseText || '(no output)' });
    }

    state.pending = null;
    renderReceipt();

    if(opts.clearInput){ 
      el.rawCommandInput.value = ''; 
    }

    await refresh();

  } catch(err){
    logEntry(command, false, String(err));
    openModal({ kind:'error', title:'Something went wrong', message:String(err) });
  } finally {
    syncRunEnabled();
    el.btnRun.disabled = false;
  }
}

function logEntry(command, ok, output){
  const empty = el.logBody.querySelector('.log-empty');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<div class="cmd">${escapeHtml(command)}</div>
    <span class="status ${ok ? 'ok' : 'fail'}">${ok ? 'success' : 'fail'}</span>
    ${output ? `<div class="out">${escapeHtml(output)}</div>` : ''}`;
  el.logBody.prepend(div);
}

/* ---------------------------- modal system ---------------------------- */
function openModal({ kind, title, message, onConfirm }){
  el.modalTitle.textContent = title || (kind === 'error' ? 'Error' : 'Confirm');
  el.modalTitle.className = 'modal-title' + (kind === 'error' ? ' err' : '');
  el.modalMessage.textContent = message || '';
  el.modalActions.innerHTML = '';

  if(kind === 'confirm'){
    const cancel = document.createElement('button');
    cancel.className = 'btn subtle';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', closeModal);
    const confirm = document.createElement('button');
    confirm.className = 'btn danger';
    confirm.textContent = 'Confirm';
    confirm.addEventListener('click', () => { closeModal(); onConfirm && onConfirm(); });
    el.modalActions.append(cancel, confirm);
  } else {
    const dismiss = document.createElement('button');
    dismiss.className = 'btn accent';
    dismiss.textContent = kind === 'error' ? 'Dismiss' : 'Close';
    dismiss.addEventListener('click', closeModal);
    el.modalActions.append(dismiss);
  }
  el.modalOverlay.classList.add('open');
}
function closeModal(){
  el.modalOverlay.classList.remove('open');
}
el.modalOverlay.addEventListener('click', (e) => { if(e.target === el.modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

/* ---------------------------- log drawer open/close ---------------------------- */
function openLog(){ el.log.classList.add('open'); el.drawerScrim.classList.add('show'); }
function closeLog(){ el.log.classList.remove('open'); el.drawerScrim.classList.remove('show'); }
document.getElementById('btnLog').addEventListener('click', openLog);
document.getElementById('btnLogClose').addEventListener('click', closeLog);
el.drawerScrim.addEventListener('click', closeLog);

/* ---------------------------- navigation ---------------------------- */
async function navigateTo(path){
  state.path = path;
  state.pending = null;
  await refresh();
}

async function refresh(){
  try{
    const data = await API.listDir(state.path);
    state.path = data.path ?? state.path;
    state.entries = data.entries ?? [];
  } catch(err){
    state.entries = [];
    logEntry(`list ${state.path}`, false, String(err));
    openModal({ kind:'error', title:'Could not load folder', message:String(err) });
  }
  renderCrumbs();
  renderGrid();
  renderReceipt();
}

/* ---------------------------- helpers ---------------------------- */
function joinPath(base, name){
  if(base === '.') return name;
  return base.replace(/\/$/, '') + '/' + name;
}
function entryPath(name){
  return joinPath(state.path, name);
}
function quoteIfNeeded(v){
  if(v == null) return '';
  return /[^A-Za-z0-9_./:-]/.test(v) ? `'${v.replace(/'/g, "'\\''")}'` : v;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------------------- boot ---------------------------- */
refresh();
</script>
